name: Build image

# Builds an image for each upstream release tag of signaldeck-ci-server.
# The upstream repo needs no changes: a daily check picks up new tags.

on:
  schedule:
    - cron: '17 4 * * *'
  push:
    branches: [main]
    paths-ignore: ['**.md', 'portainer/**']
  pull_request:
  workflow_dispatch:
    inputs:
      version:
        description: 'Upstream tag to build (e.g. v1.2.4). Empty = latest release.'
        required: false
        default: ''

env:
  UPSTREAM_REPO: https://github.com/benwake1/signaldeck-ci-server.git
  GHCR_IMAGE: ghcr.io/${{ github.repository_owner }}/signaldeck-ci
  # Optional: set repository variable DOCKERHUB_IMAGE (e.g. signaldeck/signaldeck-ci)
  # and secrets DOCKERHUB_USERNAME / DOCKERHUB_TOKEN to also push to Docker Hub.
  DOCKERHUB_IMAGE: ${{ vars.DOCKERHUB_IMAGE }}

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  resolve:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.resolve.outputs.version }}
      semver: ${{ steps.resolve.outputs.semver }}
      is_latest: ${{ steps.resolve.outputs.is_latest }}
      build: ${{ steps.resolve.outputs.build }}
    steps:
      - id: resolve
        run: |
          set -euo pipefail
          latest=$(git ls-remote --tags --refs "$UPSTREAM_REPO" \
            | awk -F/ '{print $3}' \
            | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' \
            | sort -V | tail -1)
          version="${{ inputs.version }}"
          version="${version:-$latest}"

          git ls-remote --exit-code --tags "$UPSTREAM_REPO" "refs/tags/${version}" > /dev/null \
            || { echo "::error::Upstream tag ${version} not found"; exit 1; }

          # Scheduled runs build new upstream tags. On Mondays the current
          # release is rebuilt anyway to pick up OS and browser security updates.
          build=true
          if [[ "${{ github.event_name }}" == schedule && "$(date -u +%u)" != 1 ]] \
             && docker manifest inspect "${GHCR_IMAGE}:${version#v}" > /dev/null 2>&1; then
            echo "Image for ${version} already published — nothing to do."
            build=false
          fi

          {
            echo "version=${version}"
            echo "semver=${version#v}"
            echo "is_latest=$([[ "$version" == "$latest" ]] && echo true || echo false)"
            echo "build=${build}"
          } >> "$GITHUB_OUTPUT"
          echo "Upstream latest: ${latest}; building: ${version} (build=${build})"

  build:
    needs: resolve
    if: needs.resolve.outputs.build == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
      packages: write
    env:
      VERSION: ${{ needs.resolve.outputs.version }}
      PUBLISH: ${{ github.event_name != 'pull_request' }}
      HAS_DOCKERHUB: ${{ secrets.DOCKERHUB_TOKEN != '' && vars.DOCKERHUB_IMAGE != '' }}
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      # ── Smoke test (amd64) before anything is published ──────────────────
      - name: Build test image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          platforms: linux/amd64
          tags: signaldeck-ci:test
          build-args: SIGNALDECK_VERSION=${{ env.VERSION }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test stack
        run: |
          set -euo pipefail
          cat > .env <<EOF
          SIGNALDECK_IMAGE=signaldeck-ci
          SIGNALDECK_TAG=test
          APP_URL=http://localhost:8080
          DB_PASSWORD=$(openssl rand -hex 16)
          DB_ROOT_PASSWORD=$(openssl rand -hex 16)
          REDIS_PASSWORD=$(openssl rand -hex 16)
          ADMIN_EMAIL=ci@example.com
          ADMIN_PASSWORD=$(openssl rand -hex 16)
          STOP_GRACE_PERIOD=30s
          EOF
          docker compose up -d
          for i in $(seq 1 60); do
            status=$(docker inspect -f '{{.State.Health.Status}}' "$(docker compose ps -q signaldeck)")
            [[ "$status" == healthy ]] && break
            [[ "$status" == unhealthy ]] && break
            sleep 5
          done
          docker compose ps
          [[ "$status" == healthy ]] || { docker compose logs signaldeck; exit 1; }

          curl -fsS http://localhost:8080/up > /dev/null
          curl -fsS -o /dev/null -w 'login page: %{http_code}\n' http://localhost:8080/admin/login
          # Proxy handling: HTTPS via X-Forwarded-Proto must produce https URLs
          curl -fsS -H 'X-Forwarded-Proto: https' http://localhost:8080/admin/login | grep -q 'https://localhost:8080' \
            || { echo "::error::X-Forwarded-Proto not honoured"; exit 1; }

          docker compose exec -T signaldeck node --version
          docker compose exec -T -u www-data signaldeck php artisan about --only=environment

      - name: Smoke test logs
        if: failure()
        run: docker compose logs --no-color

      - name: Tear down
        if: always()
        run: docker compose down -v

      # ── Publish multi-arch ───────────────────────────────────────────────
      - name: Log in to GHCR
        if: env.PUBLISH == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        if: env.PUBLISH == 'true' && env.HAS_DOCKERHUB == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ env.GHCR_IMAGE }}
            ${{ env.HAS_DOCKERHUB == 'true' && env.DOCKERHUB_IMAGE || '' }}
          flavor: latest=false
          tags: |
            type=semver,pattern={{version}},value=${{ env.VERSION }}
            type=semver,pattern={{major}}.{{minor}},value=${{ env.VERSION }},enable=${{ needs.resolve.outputs.is_latest }}
            type=semver,pattern={{major}},value=${{ env.VERSION }},enable=${{ needs.resolve.outputs.is_latest }}
            type=raw,value=latest,enable=${{ needs.resolve.outputs.is_latest }}

      - name: Build and push
        if: env.PUBLISH == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          build-args: SIGNALDECK_VERSION=${{ env.VERSION }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: true
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
