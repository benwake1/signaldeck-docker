; SignalDeck CI — PHP-FPM pool (rendered by signaldeck-entrypoint)
[www]
user = www-data
group = www-data

listen = /run/php/php8.4-fpm.sock
listen.owner = www-data
listen.group = www-data
listen.mode = 0660

; Each open live-log stream (SSE) holds a worker for the life of the run,
; so this is sized well above the usual default of 5. PHP_FPM_MAX_CHILDREN.
pm = dynamic
pm.max_children = __MAX_CHILDREN__
pm.start_servers = __START_SERVERS__
pm.min_spare_servers = __MIN_SPARE__
pm.max_spare_servers = __MAX_SPARE__
pm.max_requests = 500

; Keep the container environment — the app shells out to git/npm/node
; (Playwright project discovery) and needs PATH, caches and HOME.
clear_env = no
env[HOME] = /var/www

catch_workers_output = yes
decorate_workers_output = no
request_terminate_timeout = 0
