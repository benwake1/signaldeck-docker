##
## SignalDeck CI — container Nginx (rendered by signaldeck-entrypoint)
##
## Plain HTTP on port 80. TLS is expected to terminate at a reverse proxy
## (Traefik, Caddy, Nginx Proxy Manager, Cloudflare Tunnel, ...).
##

# Tell Laravel the request was HTTPS when a proxy says so, so generated URLs,
# redirects and secure cookies are correct without app-level trustProxies.
map $http_x_forwarded_proto $signaldeck_https {
    default $https;
    https   on;
}

server {
    # IPv4 only: many Docker hosts disable IPv6 inside containers, where an
    # [::]:80 listener would stop Nginx from starting.
    listen 80 default_server;
    server_name _;

    root /var/www/app/public;
    index index.php;
    charset utf-8;
    server_tokens off;

    access_log /dev/stdout;
    error_log  /dev/stderr warn;

    # Recover the real client IP from trusted proxies (TRUSTED_PROXIES)
__SET_REAL_IP_FROM__
    real_ip_header    X-Forwarded-For;
    real_ip_recursive on;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    client_max_body_size __MAX_UPLOAD_SIZE__;

    location = /up          { access_log off; try_files $uri /index.php?$query_string; }
    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    # Fingerprinted Vite assets
    location /build/ {
        access_log off;
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_pass unix:/run/php/php8.4-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_param HTTPS $signaldeck_https if_not_empty;
        # Live-log SSE streams send a heartbeat every few seconds and disable
        # buffering via X-Accel-Buffering, so this only bounds idle requests.
        fastcgi_read_timeout 300;
    }

    location ~ /\.(?!well-known).* { deny all; }
}
