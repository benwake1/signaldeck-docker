; Test runs (Cypress + Playwright). One process = one concurrent run.
; graceful-worker lets an in-progress run finish before the worker gets
; SIGTERM; after WORKER_STOP_WAIT seconds the run is killed. Keep the container
; stop timeout (stop_grace_period) above it.
; Only the wrapper is signalled (stopasgroup=false): signalling the group
; would terminate the running browser immediately.
[program:queue-cypress]
command=/usr/local/lib/signaldeck/graceful-worker php /var/www/app/artisan queue:work --queue=cypress --sleep=3 --tries=1 --timeout=__WORKER_TIMEOUT__ --max-time=3600
directory=/var/www/app
user=www-data
environment=HOME="/var/www",USER="www-data"
numprocs=__WORKER_PROCESSES__
process_name=%(program_name)s_%(process_num)02d
autostart=true
autorestart=true
stopasgroup=false
killasgroup=true
stopsignal=TERM
stopwaitsecs=__WORKER_STOP_WAIT__
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

; Notifications, email, Slack and other short jobs
[program:queue-default]
command=php /var/www/app/artisan queue:work --queue=default --sleep=3 --tries=3 --timeout=120 --max-time=3600
directory=/var/www/app
user=www-data
environment=HOME="/var/www",USER="www-data"
numprocs=1
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
stopwaitsecs=130
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
