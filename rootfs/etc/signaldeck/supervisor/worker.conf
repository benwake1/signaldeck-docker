; Test runs (Cypress + Playwright). One process = one concurrent run.
; Workers finish their current job on SIGTERM; after WORKER_STOP_WAIT seconds
; the run is killed. Keep the container stop timeout (stop_grace_period) above it.
[program:queue-cypress]
command=php /var/www/app/artisan queue:work --queue=cypress --sleep=3 --tries=1 --timeout=__WORKER_TIMEOUT__ --max-time=3600
directory=/var/www/app
user=www-data
environment=HOME="/var/www",USER="www-data"
numprocs=__WORKER_PROCESSES__
process_name=%(program_name)s_%(process_num)02d
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
stopsignal=TERM
stopwaitsecs=__WORKER_STOP_WAIT__
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

; Notifications, email, Slack and other short jobs
[program:queue-default]
command=php /var/www/app/artisan queue:work --queue=default --sleep=3 --tries=3 --timeout=120 --max-time=3600
directory=/var/www/app
user=www-data
environment=HOME="/var/www",USER="www-data"
numprocs=1
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
stopwaitsecs=130
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
