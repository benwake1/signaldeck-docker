; Artifact cleanup, run-event pruning and cron-scheduled suites
; (signaldeck:run-scheduled runs every minute).
[program:scheduler]
command=php /var/www/app/artisan schedule:work
directory=/var/www/app
user=www-data
environment=HOME="/var/www",USER="www-data"
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
stopwaitsecs=60
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
